<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#f4f7f5"/><rect x="35" y="35" width="220" height="830" rx="22" fill="#ffffff" stroke="#dce7e1" stroke-width="1.5"/><text x="57" y="78" font-family="Arial" font-size="14px" font-weight="900" fill="#d8ec67" text-anchor="middle">SA</text><circle cx="57" cy="74" r="22" fill="#11262c"/><text x="57" y="80" font-family="Arial" font-size="13px" font-weight="900" fill="#d8ec67" text-anchor="middle">SA</text><text x="91" y="70" font-family="Arial" font-size="16px" font-weight="900" fill="#11262c" text-anchor="start">SustainAI</text><text x="91" y="90" font-family="Arial" font-size="16px" font-weight="900" fill="#11262c" text-anchor="start">Router</text><text x="57" y="133" font-family="Arial" font-size="10px" font-weight="900" fill="#6a7d82" text-anchor="start">DECISION FLOW</text><rect x="48" y="157" width="194" height="47" rx="11" fill="#11262c" stroke="#11262c" stroke-width="1.5"/><rect x="58" y="167" width="27" height="27" rx="8" fill="#d8ec67" stroke="#d8ec67" stroke-width="1.5"/><text x="71.5" y="186" font-family="Arial" font-size="9px" font-weight="900" fill="#11262c" text-anchor="middle">01</text><text x="96" y="177" font-family="Arial" font-size="11px" font-weight="900" fill="#fff" text-anchor="start">Task input</text><text x="96" y="193" font-family="Arial" font-size="9px" font-weight="400" fill="#fff" text-anchor="start">Define the request</text><rect x="48" y="215" width="194" height="47" rx="11" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><rect x="58" y="225" width="27" height="27" rx="8" fill="#edf4ef" stroke="#edf4ef" stroke-width="1.5"/><text x="71.5" y="244" font-family="Arial" font-size="9px" font-weight="900" fill="#087b62" text-anchor="middle">02</text><text x="96" y="235" font-family="Arial" font-size="11px" font-weight="900" fill="#6a7d82" text-anchor="start">Task analysis</text><text x="96" y="251" font-family="Arial" font-size="9px" font-weight="400" fill="#6a7d82" text-anchor="start">Capability + risk</text><rect x="48" y="273" width="194" height="47" rx="11" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><rect x="58" y="283" width="27" height="27" rx="8" fill="#edf4ef" stroke="#edf4ef" stroke-width="1.5"/><text x="71.5" y="302" font-family="Arial" font-size="9px" font-weight="900" fill="#087b62" text-anchor="middle">03</text><text x="96" y="293" font-family="Arial" font-size="11px" font-weight="900" fill="#6a7d82" text-anchor="start">Compare tiers</text><text x="96" y="309" font-family="Arial" font-size="9px" font-weight="400" fill="#6a7d82" text-anchor="start">Illustrative registry</text><rect x="48" y="331" width="194" height="47" rx="11" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><rect x="58" y="341" width="27" height="27" rx="8" fill="#edf4ef" stroke="#edf4ef" stroke-width="1.5"/><text x="71.5" y="360" font-family="Arial" font-size="9px" font-weight="900" fill="#087b62" text-anchor="middle">04</text><text x="96" y="351" font-family="Arial" font-size="11px" font-weight="900" fill="#6a7d82" text-anchor="start">Recommendation</text><text x="96" y="367" font-family="Arial" font-size="9px" font-weight="400" fill="#6a7d82" text-anchor="start">Reason + control</text><line x1="57" y1="410" x2="232" y2="410" stroke="#dce7e1"/><text x="57" y="439" font-family="Arial" font-size="10px" font-weight="900" fill="#6a7d82" text-anchor="start">CONTROL POSTURE</text><text x="57" y="470" font-family="Arial" font-size="11px" font-weight="400" fill="#6a7d82" text-anchor="start">Recommendations support</text><text x="57" y="488" font-family="Arial" font-size="11px" font-weight="400" fill="#6a7d82" text-anchor="start">developer judgment. They do not</text><text x="57" y="506" font-family="Arial" font-size="11px" font-weight="400" fill="#6a7d82" text-anchor="start">automatically control deployment.</text><rect x="57" y="548" width="24" height="13" rx="99" fill="#087b62" stroke="#087b62" stroke-width="1.5"/><text x="69.0" y="558.5" font-family="Arial" font-size="11px" font-weight="800" fill="#ffffff" text-anchor="middle"></text><text x="90" y="558" font-family="Arial" font-size="10px" font-weight="700" fill="#6a7d82" text-anchor="start">Human override</text><rect x="57" y="580" width="24" height="13" rx="99" fill="#cad8d0" stroke="#cad8d0" stroke-width="1.5"/><text x="69.0" y="590.5" font-family="Arial" font-size="11px" font-weight="800" fill="#ffffff" text-anchor="middle"></text><text x="90" y="590" font-family="Arial" font-size="10px" font-weight="700" fill="#6a7d82" text-anchor="start">Prompt retention off</text><rect x="57" y="692" width="174" height="108" rx="12" fill="#f3faf5" stroke="#99beac" stroke-width="1.5"/><text x="72" y="720" font-family="Arial" font-size="10px" font-weight="900" fill="#087b62" text-anchor="start">PROTOTYPE MODE</text><text x="72" y="747" font-family="Arial" font-size="11px" font-weight="400" fill="#6a7d82" text-anchor="start">Illustrative profiles.</text><text x="72" y="764" font-family="Arial" font-size="11px" font-weight="400" fill="#6a7d82" text-anchor="start">No live telemetry.</text><text x="72" y="781" font-family="Arial" font-size="11px" font-weight="400" fill="#6a7d82" text-anchor="start">Offline demonstrator.</text><text x="285" y="70" font-family="Arial" font-size="10px" font-weight="900" fill="#087b62" text-anchor="start">SUSTAINABILITY-AWARE AI DECISION SUPPORT</text><text x="285" y="113" font-family="Arial" font-size="31px" font-weight="900" fill="#11262c" text-anchor="start">Define the task before choosing the model.</text><text x="285" y="142" font-family="Arial" font-size="12px" font-weight="400" fill="#6a7d82" text-anchor="start">A clear task profile makes a clearer capability and resource decision.</text><rect x="1190" y="57" width="340" height="56" rx="13" fill="#ffffff" stroke="#dce7e1" stroke-width="1.5"/><circle cx="1220" cy="85" r="15" fill="#dff3ea"/><text x="1220" y="90" font-family="Arial" font-size="13px" font-weight="900" fill="#087b62" text-anchor="middle">↗</text><text x="1245" y="78" font-family="Arial" font-size="9px" font-weight="900" fill="#6a7d82" text-anchor="start">CURRENT DECISION</text><text x="1245" y="99" font-family="Arial" font-size="12px" font-weight="900" fill="#11262c" text-anchor="start">Awaiting task analysis</text><rect x="285" y="177" width="29" height="29" rx="8" fill="#087b62" stroke="#087b62" stroke-width="1.5"/><text x="299.5" y="197" font-family="Arial" font-size="9px" font-weight="900" fill="#fff" text-anchor="middle">01</text><text x="324" y="196" font-family="Arial" font-size="10px" font-weight="900" fill="#087b62" text-anchor="start">Task input</text><line x1="397" y1="191" x2="432" y2="191" stroke="#dce7e1"/><rect x="455" y="177" width="29" height="29" rx="8" fill="#edf3ef" stroke="#edf3ef" stroke-width="1.5"/><text x="469.5" y="197" font-family="Arial" font-size="9px" font-weight="900" fill="#6a7d82" text-anchor="middle">02</text><text x="494" y="196" font-family="Arial" font-size="10px" font-weight="900" fill="#6a7d82" text-anchor="start">Analysis</text><line x1="567" y1="191" x2="602" y2="191" stroke="#dce7e1"/><rect x="625" y="177" width="29" height="29" rx="8" fill="#edf3ef" stroke="#edf3ef" stroke-width="1.5"/><text x="639.5" y="197" font-family="Arial" font-size="9px" font-weight="900" fill="#6a7d82" text-anchor="middle">03</text><text x="664" y="196" font-family="Arial" font-size="10px" font-weight="900" fill="#6a7d82" text-anchor="start">Comparison</text><line x1="737" y1="191" x2="772" y2="191" stroke="#dce7e1"/><rect x="795" y="177" width="29" height="29" rx="8" fill="#edf3ef" stroke="#edf3ef" stroke-width="1.5"/><text x="809.5" y="197" font-family="Arial" font-size="9px" font-weight="900" fill="#6a7d82" text-anchor="middle">04</text><text x="834" y="196" font-family="Arial" font-size="10px" font-weight="900" fill="#6a7d82" text-anchor="start">Recommendation</text><rect x="285" y="225" width="760" height="590" rx="16" fill="#ffffff" stroke="#dce7e1" stroke-width="1.5"/><text x="312" y="260" font-family="Arial" font-size="17px" font-weight="900" fill="#11262c" text-anchor="start">ENTER THE AI TASK</text><text x="312" y="284" font-family="Arial" font-size="11px" font-weight="400" fill="#6a7d82" text-anchor="start">The demonstrator classifies the task using transparent demo logic.</text><rect x="875" y="251" width="143" height="24" rx="99" fill="#dff3ea" stroke="#bfe0cd" stroke-width="1.5"/><text x="946.5" y="267.0" font-family="Arial" font-size="9px" font-weight="800" fill="#087b62" text-anchor="middle">OFFLINE DEMO</text><text x="312" y="319" font-family="Arial" font-size="9px" font-weight="900" fill="#6a7d82" text-anchor="start">TRY A PREPARED TASK</text><rect x="312" y="334" width="170" height="28" rx="99" fill="#ffffff" stroke="#dce7e1" stroke-width="1.5"/><text x="397.0" y="352.0" font-family="Arial" font-size="9px" font-weight="800" fill="#28434a" text-anchor="middle">Business report + risks</text><rect x="492" y="334" width="150" height="28" rx="99" fill="#ffffff" stroke="#dce7e1" stroke-width="1.5"/><text x="567.0" y="352.0" font-family="Arial" font-size="9px" font-weight="800" fill="#28434a" text-anchor="middle">Translate → Marathi</text><rect x="652" y="334" width="154" height="28" rx="99" fill="#ffffff" stroke="#dce7e1" stroke-width="1.5"/><text x="729.0" y="352.0" font-family="Arial" font-size="9px" font-weight="800" fill="#28434a" text-anchor="middle">Find contradictions</text><rect x="815" y="334" width="125" height="28" rx="99" fill="#ffffff" stroke="#dce7e1" stroke-width="1.5"/><text x="877.5" y="352.0" font-family="Arial" font-size="9px" font-weight="800" fill="#28434a" text-anchor="middle">Classify tickets</text><text x="312" y="405" font-family="Arial" font-size="9px" font-weight="900" fill="#6a7d82" text-anchor="start">TASK DESCRIPTION</text><rect x="312" y="420" width="705" height="126" rx="12" fill="#ffffff" stroke="#cfddd4" stroke-width="1.5"/><text x="332" y="458" font-family="Arial" font-size="18px" font-weight="700" fill="#11262c" text-anchor="start">Summarize a 20-page business report</text><text x="332" y="486" font-family="Arial" font-size="18px" font-weight="700" fill="#11262c" text-anchor="start">and identify the key risks.</text><text x="312" y="583" font-family="Arial" font-size="9px" font-weight="900" fill="#6a7d82" text-anchor="start">OPTIONAL TASK TYPE</text><rect x="312" y="598" width="337" height="40" rx="10" fill="#ffffff" stroke="#cfddd4" stroke-width="1.5"/><text x="328" y="623" font-family="Arial" font-size="12px" font-weight="700" fill="#11262c" text-anchor="start">Auto-detect</text><text x="630" y="623" font-family="Arial" font-size="13px" font-weight="900" fill="#6a7d82" text-anchor="start">⌄</text><text x="680" y="583" font-family="Arial" font-size="9px" font-weight="900" fill="#6a7d82" text-anchor="start">CONTEXT PROFILE</text><rect x="680" y="598" width="337" height="40" rx="10" fill="#ffffff" stroke="#cfddd4" stroke-width="1.5"/><text x="696" y="623" font-family="Arial" font-size="12px" font-weight="700" fill="#11262c" text-anchor="start">Infer from task</text><text x="998" y="623" font-family="Arial" font-size="13px" font-weight="900" fill="#6a7d82" text-anchor="start">⌄</text><text x="312" y="677" font-family="Arial" font-size="9px" font-weight="900" fill="#6a7d82" text-anchor="start">DECISION PRIORITY</text><rect x="312" y="690" width="220" height="61" rx="11" fill="#ffffff" stroke="#dce7e1" stroke-width="1.5"/><text x="325" y="714" font-family="Arial" font-size="11px" font-weight="900" fill="#11262c" text-anchor="start">Quality first</text><text x="325" y="733" font-family="Arial" font-size="9px" font-weight="400" fill="#6a7d82" text-anchor="start">Stronger when uncertain</text><rect x="542" y="690" width="220" height="61" rx="11" fill="#dff3ea" stroke="#087b62" stroke-width="1.5"/><text x="555" y="714" font-family="Arial" font-size="11px" font-weight="900" fill="#11262c" text-anchor="start">Balanced</text><text x="555" y="733" font-family="Arial" font-size="9px" font-weight="400" fill="#6a7d82" text-anchor="start">Meet floor efficiently</text><rect x="772" y="690" width="245" height="61" rx="11" fill="#ffffff" stroke="#dce7e1" stroke-width="1.5"/><text x="785" y="714" font-family="Arial" font-size="11px" font-weight="900" fill="#11262c" text-anchor="start">Resource-aware</text><text x="785" y="733" font-family="Arial" font-size="9px" font-weight="400" fill="#6a7d82" text-anchor="start">Lower intensity when safe</text><rect x="312" y="772" width="143" height="34" rx="99" fill="#087b62" stroke="#087b62" stroke-width="1.5"/><text x="383.5" y="793.0" font-family="Arial" font-size="10px" font-weight="800" fill="#ffffff" text-anchor="middle">Analyze task  →</text><rect x="465" y="772" width="65" height="34" rx="99" fill="#edf4f0" stroke="#edf4f0" stroke-width="1.5"/><text x="497.5" y="793.0" font-family="Arial" font-size="10px" font-weight="800" fill="#11262c" text-anchor="middle">Reset</text><rect x="545" y="778" width="158" height="24" rx="99" fill="#ffffff" stroke="#dce7e1" stroke-width="1.5"/><text x="624.0" y="794.0" font-family="Arial" font-size="8px" font-weight="800" fill="#6a7d82" text-anchor="middle">DEMO LOGIC · CONFIGURABLE</text><rect x="1070" y="225" width="460" height="590" rx="16" fill="#ffffff" stroke="#dce7e1" stroke-width="1.5"/><text x="1100" y="260" font-family="Arial" font-size="11px" font-weight="900" fill="#6a7d82" text-anchor="start">WHAT THE ROUTER WILL SHOW</text><rect x="1100" y="290" width="400" height="61" rx="11" fill="#ffffff" stroke="#dce7e1" stroke-width="1.5"/><rect x="1112" y="305" width="23" height="23" rx="7" fill="#dff3ea" stroke="#dff3ea" stroke-width="1.5"/><text x="1123.5" y="321" font-family="Arial" font-size="9px" font-weight="900" fill="#087b62" text-anchor="middle">1</text><text x="1150" y="313" font-family="Arial" font-size="11px" font-weight="900" fill="#11262c" text-anchor="start">Understand the request</text><text x="1150" y="332" font-family="Arial" font-size="9px" font-weight="400" fill="#6a7d82" text-anchor="start">Task family, context and capability signals.</text><rect x="1100" y="367" width="400" height="61" rx="11" fill="#ffffff" stroke="#dce7e1" stroke-width="1.5"/><rect x="1112" y="382" width="23" height="23" rx="7" fill="#dff3ea" stroke="#dff3ea" stroke-width="1.5"/><text x="1123.5" y="398" font-family="Arial" font-size="9px" font-weight="900" fill="#087b62" text-anchor="middle">2</text><text x="1150" y="390" font-family="Arial" font-size="11px" font-weight="900" fill="#11262c" text-anchor="start">Apply a quality floor</text><text x="1150" y="409" font-family="Arial" font-size="9px" font-weight="400" fill="#6a7d82" text-anchor="start">Risk and user priority constrain the choice.</text><rect x="1100" y="444" width="400" height="61" rx="11" fill="#ffffff" stroke="#dce7e1" stroke-width="1.5"/><rect x="1112" y="459" width="23" height="23" rx="7" fill="#dff3ea" stroke="#dff3ea" stroke-width="1.5"/><text x="1123.5" y="475" font-family="Arial" font-size="9px" font-weight="900" fill="#087b62" text-anchor="middle">3</text><text x="1150" y="467" font-family="Arial" font-size="11px" font-weight="900" fill="#11262c" text-anchor="start">Compare profiles</text><text x="1150" y="486" font-family="Arial" font-size="9px" font-weight="400" fill="#6a7d82" text-anchor="start">Capability, quality, latency, cost and resource level.</text><rect x="1100" y="521" width="400" height="61" rx="11" fill="#ffffff" stroke="#dce7e1" stroke-width="1.5"/><rect x="1112" y="536" width="23" height="23" rx="7" fill="#dff3ea" stroke="#dff3ea" stroke-width="1.5"/><text x="1123.5" y="552" font-family="Arial" font-size="9px" font-weight="900" fill="#087b62" text-anchor="middle">4</text><text x="1150" y="544" font-family="Arial" font-size="11px" font-weight="900" fill="#11262c" text-anchor="start">Explain and keep control</text><text x="1150" y="563" font-family="Arial" font-size="9px" font-weight="400" fill="#6a7d82" text-anchor="start">Why this tier, what could go wrong and when to escalate.</text><rect x="1100" y="620" width="400" height="112" rx="12" fill="#f3faf5" stroke="#99beac" stroke-width="1.5"/><text x="1116" y="647" font-family="Arial" font-size="10px" font-weight="900" fill="#087b62" text-anchor="start">PROTOTYPE NOTE</text><text x="1116" y="674" font-family="Arial" font-size="10px" font-weight="400" fill="#6a7d82" text-anchor="start">Illustrative model/resource profiles.</text><text x="1116" y="691" font-family="Arial" font-size="10px" font-weight="400" fill="#6a7d82" text-anchor="start">Production needs validated capability</text><text x="1116" y="708" font-family="Arial" font-size="10px" font-weight="400" fill="#6a7d82" text-anchor="start">benchmarks and provider/workload telemetry.</text><text x="285" y="850" font-family="Arial" font-size="10px" font-weight="400" fill="#6a7d82" text-anchor="start">Offline demonstrator · SustainAI Router · SDG 12</text><text x="1530" y="850" font-family="Arial" font-size="10px" font-weight="800" fill="#087b62" text-anchor="end">Illustrative profiles only</text></svg>