<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#f4f7f5"/><rect x="35" y="35" width="220" height="830" rx="22" fill="#ffffff" stroke="#dce7e1" stroke-width="1.5"/><text x="57" y="78" font-family="Arial" font-size="14px" font-weight="900" fill="#d8ec67" text-anchor="middle">SA</text><circle cx="57" cy="74" r="22" fill="#11262c"/><text x="57" y="80" font-family="Arial" font-size="13px" font-weight="900" fill="#d8ec67" text-anchor="middle">SA</text><text x="91" y="70" font-family="Arial" font-size="16px" font-weight="900" fill="#11262c" text-anchor="start">SustainAI</text><text x="91" y="90" font-family="Arial" font-size="16px" font-weight="900" fill="#11262c" text-anchor="start">Router</text><text x="57" y="133" font-family="Arial" font-size="10px" font-weight="900" fill="#6a7d82" text-anchor="start">DECISION FLOW</text><rect x="48" y="157" width="194" height="47" rx="11" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><rect x="58" y="167" width="27" height="27" rx="8" fill="#edf4ef" stroke="#edf4ef" stroke-width="1.5"/><text x="71.5" y="186" font-family="Arial" font-size="9px" font-weight="900" fill="#087b62" text-anchor="middle">01</text><text x="96" y="177" font-family="Arial" font-size="11px" font-weight="900" fill="#6a7d82" text-anchor="start">Task input</text><text x="96" y="193" font-family="Arial" font-size="9px" font-weight="400" fill="#6a7d82" text-anchor="start">Define the request</text><rect x="48" y="215" width="194" height="47" rx="11" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><rect x="58" y="225" width="27" height="27" rx="8" fill="#edf4ef" stroke="#edf4ef" stroke-width="1.5"/><text x="71.5" y="244" font-family="Arial" font-size="9px" font-weight="900" fill="#087b62" text-anchor="middle">02</text><text x="96" y="235" font-family="Arial" font-size="11px" font-weight="900" fill="#6a7d82" text-anchor="start">Task analysis</text><text x="96" y="251" font-family="Arial" font-size="9px" font-weight="400" fill="#6a7d82" text-anchor="start">Capability + risk</text><rect x="48" y="273" width="194" height="47" rx="11" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><rect x="58" y="283" width="27" height="27" rx="8" fill="#edf4ef" stroke="#edf4ef" stroke-width="1.5"/><text x="71.5" y="302" font-family="Arial" font-size="9px" font-weight="900" fill="#087b62" text-anchor="middle">03</text><text x="96" y="293" font-family="Arial" font-size="11px" font-weight="900" fill="#6a7d82" text-anchor="start">Compare tiers</text><text x="96" y="309" font-family="Arial" font-size="9px" font-weight="400" fill="#6a7d82" text-anchor="start">Illustrative registry</text><rect x="48" y="331" width="194" height="47" rx="11" fill="#11262c" stroke="#11262c" stroke-width="1.5"/><rect x="58" y="341" width="27" height="27" rx="8" fill="#d8ec67" stroke="#d8ec67" stroke-width="1.5"/><text x="71.5" y="360" font-family="Arial" font-size="9px" font-weight="900" fill="#11262c" text-anchor="middle">04</text><text x="96" y="351" font-family="Arial" font-size="11px" font-weight="900" fill="#fff" text-anchor="start">Recommendation</text><text x="96" y="367" font-family="Arial" font-size="9px" font-weight="400" fill="#fff" text-anchor="start">Reason + control</text><line x1="57" y1="410" x2="232" y2="410" stroke="#dce7e1"/><text x="57" y="439" font-family="Arial" font-size="10px" font-weight="900" fill="#6a7d82" text-anchor="start">CONTROL POSTURE</text><text x="57" y="470" font-family="Arial" font-size="11px" font-weight="400" fill="#6a7d82" text-anchor="start">Recommendations support</text><text x="57" y="488" font-family="Arial" font-size="11px" font-weight="400" fill="#6a7d82" text-anchor="start">developer judgment. They do not</text><text x="57" y="506" font-family="Arial" font-size="11px" font-weight="400" fill="#6a7d82" text-anchor="start">automatically control deployment.</text><rect x="57" y="548" width="24" height="13" rx="99" fill="#087b62" stroke="#087b62" stroke-width="1.5"/><text x="69.0" y="558.5" font-family="Arial" font-size="11px" font-weight="800" fill="#ffffff" text-anchor="middle"></text><text x="90" y="558" font-family="Arial" font-size="10px" font-weight="700" fill="#6a7d82" text-anchor="start">Human override</text><rect x="57" y="580" width="24" height="13" rx="99" fill="#cad8d0" stroke="#cad8d0" stroke-width="1.5"/><text x="69.0" y="590.5" font-family="Arial" font-size="11px" font-weight="800" fill="#ffffff" text-anchor="middle"></text><text x="90" y="590" font-family="Arial" font-size="10px" font-weight="700" fill="#6a7d82" text-anchor="start">Prompt retention off</text><rect x="57" y="692" width="174" height="108" rx="12" fill="#f3faf5" stroke="#99beac" stroke-width="1.5"/><text x="72" y="720" font-family="Arial" font-size="10px" font-weight="900" fill="#087b62" text-anchor="start">PROTOTYPE MODE</text><text x="72" y="747" font-family="Arial" font-size="11px" font-weight="400" fill="#6a7d82" text-anchor="start">Illustrative profiles.</text><text x="72" y="764" font-family="Arial" font-size="11px" font-weight="400" fill="#6a7d82" text-anchor="start">No live telemetry.</text><text x="72" y="781" font-family="Arial" font-size="11px" font-weight="400" fill="#6a7d82" text-anchor="start">Offline demonstrator.</text><text x="285" y="70" font-family="Arial" font-size="10px" font-weight="900" fill="#087b62" text-anchor="start">SUSTAINABILITY-AWARE AI DECISION SUPPORT</text><text x="285" y="113" font-family="Arial" font-size="31px" font-weight="900" fill="#11262c" text-anchor="start">Review the recommendation — then decide.</text><text x="285" y="142" font-family="Arial" font-size="12px" font-weight="400" fill="#6a7d82" text-anchor="start">SustainAI Router supports developer judgment; it does not automatically control deployment.</text><rect x="1190" y="57" width="340" height="56" rx="13" fill="#ffffff" stroke="#dce7e1" stroke-width="1.5"/><circle cx="1220" cy="85" r="15" fill="#dff3ea"/><text x="1220" y="90" font-family="Arial" font-size="13px" font-weight="900" fill="#087b62" text-anchor="middle">↗</text><text x="1245" y="78" font-family="Arial" font-size="9px" font-weight="900" fill="#6a7d82" text-anchor="start">CURRENT DECISION</text><text x="1245" y="99" font-family="Arial" font-size="12px" font-weight="900" fill="#11262c" text-anchor="start">Balanced Tier recommended · review available</text><rect x="285" y="177" width="29" height="29" rx="8" fill="#dff3ea" stroke="#dff3ea" stroke-width="1.5"/><text x="299.5" y="197" font-family="Arial" font-size="9px" font-weight="900" fill="#087b62" text-anchor="middle">✓</text><text x="324" y="196" font-family="Arial" font-size="10px" font-weight="900" fill="#6a7d82" text-anchor="start">Task input</text><line x1="397" y1="191" x2="432" y2="191" stroke="#dce7e1"/><rect x="455" y="177" width="29" height="29" rx="8" fill="#dff3ea" stroke="#dff3ea" stroke-width="1.5"/><text x="469.5" y="197" font-family="Arial" font-size="9px" font-weight="900" fill="#087b62" text-anchor="middle">✓</text><text x="494" y="196" font-family="Arial" font-size="10px" font-weight="900" fill="#6a7d82" text-anchor="start">Analysis</text><line x1="567" y1="191" x2="602" y2="191" stroke="#dce7e1"/><rect x="625" y="177" width="29" height="29" rx="8" fill="#dff3ea" stroke="#dff3ea" stroke-width="1.5"/><text x="639.5" y="197" font-family="Arial" font-size="9px" font-weight="900" fill="#087b62" text-anchor="middle">✓</text><text x="664" y="196" font-family="Arial" font-size="10px" font-weight="900" fill="#6a7d82" text-anchor="start">Comparison</text><line x1="737" y1="191" x2="772" y2="191" stroke="#dce7e1"/><rect x="795" y="177" width="29" height="29" rx="8" fill="#087b62" stroke="#087b62" stroke-width="1.5"/><text x="809.5" y="197" font-family="Arial" font-size="9px" font-weight="900" fill="#fff" text-anchor="middle">04</text><text x="834" y="196" font-family="Arial" font-size="10px" font-weight="900" fill="#087b62" text-anchor="start">Recommendation</text><rect x="285" y="225" width="825" height="590" rx="16" fill="#ffffff" stroke="#dce7e1" stroke-width="1.5"/><text x="313" y="260" font-family="Arial" font-size="17px" font-weight="900" fill="#11262c" text-anchor="start">EXPLAINABLE RECOMMENDATION</text><text x="313" y="283" font-family="Arial" font-size="11px" font-weight="400" fill="#6a7d82" text-anchor="start">A clear reason is part of the product.</text><rect x="313" y="293" width="769" height="20" rx="10" fill="#fbfdfb" stroke="#dce7e1" stroke-width="1.5"/><text x="326" y="307" font-family="Arial" font-size="8px" font-weight="900" fill="#087b62" text-anchor="start">ANALYZED TASK</text><text x="440" y="307" font-family="Arial" font-size="9px" font-weight="700" fill="#11262c" text-anchor="start">Summarize a 20-page business report and identify the key risks.</text><rect x="313" y="319" width="769" height="153" rx="15" fill="#11262c" stroke="#11262c" stroke-width="1.5"/><text x="338" y="349" font-family="Arial" font-size="9px" font-weight="900" fill="#d8ec67" text-anchor="start">RECOMMENDED MODEL TIER</text><text x="338" y="397" font-family="Arial" font-size="28px" font-weight="900" fill="#ffffff" text-anchor="start">Balanced Tier</text><text x="338" y="428" font-family="Arial" font-size="11px" font-weight="400" fill="#d9eee4" text-anchor="start">This task needs document context and quality-sensitive output,</text><text x="338" y="446" font-family="Arial" font-size="11px" font-weight="400" fill="#d9eee4" text-anchor="start">but it does not show a clear need for frontier-level reasoning.</text><rect x="338" y="446" width="144" height="20" rx="99" fill="rgba(255,255,255,.12)" stroke="rgba(255,255,255,.18)" stroke-width="1.5"/><text x="410.0" y="460.0" font-family="Arial" font-size="8px" font-weight="800" fill="#e7f7ef" text-anchor="middle">Complexity · Medium</text><rect x="490" y="446" width="151" height="20" rx="99" fill="rgba(255,255,255,.12)" stroke="rgba(255,255,255,.18)" stroke-width="1.5"/><text x="565.5" y="460.0" font-family="Arial" font-size="8px" font-weight="800" fill="#e7f7ef" text-anchor="middle">Quality · High</text><rect x="649" y="446" width="172" height="20" rx="99" fill="rgba(255,255,255,.12)" stroke="rgba(255,255,255,.18)" stroke-width="1.5"/><text x="735.0" y="460.0" font-family="Arial" font-size="8px" font-weight="800" fill="#e7f7ef" text-anchor="middle">Resource · Medium*</text><rect x="313" y="495" width="370" height="69" rx="11" fill="#ffffff" stroke="#dce7e1" stroke-width="1.5"/><text x="326" y="514" font-family="Arial" font-size="8px" font-weight="900" fill="#6a7d82" text-anchor="start">WHY SELECTED</text><text x="326" y="534" font-family="Arial" font-size="10px" font-weight="900" fill="#11262c" text-anchor="start">Meets the quality floor</text><text x="326" y="552" font-family="Arial" font-size="8px" font-weight="400" fill="#6a7d82" text-anchor="start">Balanced capability for context + structured output.</text><rect x="702" y="495" width="370" height="69" rx="11" fill="#ffffff" stroke="#dce7e1" stroke-width="1.5"/><text x="715" y="514" font-family="Arial" font-size="8px" font-weight="900" fill="#6a7d82" text-anchor="start">WHY NOT HIGHER</text><text x="715" y="534" font-family="Arial" font-size="10px" font-weight="900" fill="#11262c" text-anchor="start">No advanced signal</text><text x="715" y="552" font-family="Arial" font-size="8px" font-weight="400" fill="#6a7d82" text-anchor="start">May add latency and resource intensity without clear need.</text><rect x="313" y="577" width="370" height="69" rx="11" fill="#ffffff" stroke="#dce7e1" stroke-width="1.5"/><text x="326" y="596" font-family="Arial" font-size="8px" font-weight="900" fill="#6a7d82" text-anchor="start">QUALITY / RISK TRADE-OFF</text><text x="326" y="616" font-family="Arial" font-size="10px" font-weight="900" fill="#11262c" text-anchor="start">Validate on representative prompts</text><text x="326" y="634" font-family="Arial" font-size="8px" font-weight="400" fill="#6a7d82" text-anchor="start">Escalate if quality is insufficient or the task changes.</text><rect x="702" y="577" width="370" height="69" rx="11" fill="#ffffff" stroke="#dce7e1" stroke-width="1.5"/><text x="715" y="596" font-family="Arial" font-size="8px" font-weight="900" fill="#6a7d82" text-anchor="start">CONFIDENCE</text><text x="715" y="616" font-family="Arial" font-size="10px" font-weight="900" fill="#11262c" text-anchor="start">High confidence</text><text x="715" y="634" font-family="Arial" font-size="8px" font-weight="400" fill="#6a7d82" text-anchor="start">Demo signal, not a measured guarantee.</text><rect x="313" y="676" width="769" height="60" rx="11" fill="#fff5d9" stroke="#ebdfc3" stroke-width="1.5"/><text x="330" y="700" font-family="Arial" font-size="8px" font-weight="900" fill="#9a6b17" text-anchor="start">RELATIVE RESOURCE CONSIDERATION</text><text x="330" y="721" font-family="Arial" font-size="10px" font-weight="700" fill="#715a27" text-anchor="start">Lowest illustrative profile that appears capable; no exact savings claim.</text><rect x="313" y="756" width="170" height="32" rx="99" fill="#087b62" stroke="#087b62" stroke-width="1.5"/><text x="398.0" y="776.0" font-family="Arial" font-size="9px" font-weight="800" fill="#ffffff" text-anchor="middle">Review recommendation</text><rect x="493" y="756" width="180" height="32" rx="99" fill="#edf4f0" stroke="#edf4f0" stroke-width="1.5"/><text x="583.0" y="776.0" font-family="Arial" font-size="9px" font-weight="800" fill="#11262c" text-anchor="middle">Override → High</text><rect x="683" y="756" width="165" height="32" rx="99" fill="#ffebeb" stroke="#f2c8c8" stroke-width="1.5"/><text x="765.5" y="776.0" font-family="Arial" font-size="9px" font-weight="800" fill="#b94c4c" text-anchor="middle">Escalate to human</text><rect x="1135" y="225" width="395" height="590" rx="16" fill="#ffffff" stroke="#dce7e1" stroke-width="1.5"/><text x="1163" y="260" font-family="Arial" font-size="12px" font-weight="900" fill="#11262c" text-anchor="start">RESPONSIBLE AI PANEL</text><text x="1163" y="280" font-family="Arial" font-size="10px" font-weight="400" fill="#6a7d82" text-anchor="start">Safeguards built into the concept.</text><rect x="1163" y="313" width="27" height="27" rx="8" fill="#dff3ea" stroke="#dff3ea" stroke-width="1.5"/><text x="1176.5" y="332" font-family="Arial" font-size="10px" font-weight="900" fill="#087b62" text-anchor="middle">T</text><text x="1202" y="325" font-family="Arial" font-size="10px" font-weight="900" fill="#11262c" text-anchor="start">Transparency</text><text x="1202" y="342" font-family="Arial" font-size="9px" font-weight="400" fill="#6a7d82" text-anchor="start">Show why the tier was recommended and what is assumed.</text><rect x="1163" y="373" width="27" height="27" rx="8" fill="#dff3ea" stroke="#dff3ea" stroke-width="1.5"/><text x="1176.5" y="392" font-family="Arial" font-size="10px" font-weight="900" fill="#087b62" text-anchor="middle">F</text><text x="1202" y="385" font-family="Arial" font-size="10px" font-weight="900" fill="#11262c" text-anchor="start">Fairness</text><text x="1202" y="402" font-family="Arial" font-size="9px" font-weight="400" fill="#6a7d82" text-anchor="start">Evaluate quality across languages, domains and users.</text><rect x="1163" y="433" width="27" height="27" rx="8" fill="#dff3ea" stroke="#dff3ea" stroke-width="1.5"/><text x="1176.5" y="452" font-family="Arial" font-size="10px" font-weight="900" fill="#087b62" text-anchor="middle">P</text><text x="1202" y="445" font-family="Arial" font-size="10px" font-weight="900" fill="#11262c" text-anchor="start">Privacy</text><text x="1202" y="462" font-family="Arial" font-size="9px" font-weight="400" fill="#6a7d82" text-anchor="start">Minimize task data and avoid unnecessary retention.</text><rect x="1163" y="493" width="27" height="27" rx="8" fill="#dff3ea" stroke="#dff3ea" stroke-width="1.5"/><text x="1176.5" y="512" font-family="Arial" font-size="10px" font-weight="900" fill="#087b62" text-anchor="middle">S</text><text x="1202" y="505" font-family="Arial" font-size="10px" font-weight="900" fill="#11262c" text-anchor="start">Safety</text><text x="1202" y="522" font-family="Arial" font-size="9px" font-weight="400" fill="#6a7d82" text-anchor="start">Escalate conservatively for high-risk or low-confidence tasks.</text><rect x="1163" y="553" width="27" height="27" rx="8" fill="#dff3ea" stroke="#dff3ea" stroke-width="1.5"/><text x="1176.5" y="572" font-family="Arial" font-size="10px" font-weight="900" fill="#087b62" text-anchor="middle">H</text><text x="1202" y="565" font-family="Arial" font-size="10px" font-weight="900" fill="#11262c" text-anchor="start">Human oversight</text><text x="1202" y="582" font-family="Arial" font-size="9px" font-weight="400" fill="#6a7d82" text-anchor="start">Override, review and escalation remain available.</text><rect x="1163" y="633" width="339" height="114" rx="11" fill="#e8efff" stroke="#c9d7f7" stroke-width="1.5"/><text x="1180" y="659" font-family="Arial" font-size="9px" font-weight="900" fill="#2c4d97" text-anchor="start">PROTOTYPE NOTE</text><text x="1180" y="681" font-family="Arial" font-size="10px" font-weight="400" fill="#3c568f" text-anchor="start">Illustrative model/resource profiles.</text><text x="1180" y="697" font-family="Arial" font-size="10px" font-weight="400" fill="#3c568f" text-anchor="start">Production needs validated capability</text><text x="1180" y="713" font-family="Arial" font-size="10px" font-weight="400" fill="#3c568f" text-anchor="start">benchmarks and provider/workload telemetry.</text><text x="285" y="850" font-family="Arial" font-size="10px" font-weight="400" fill="#6a7d82" text-anchor="start">Offline demonstrator · SustainAI Router · SDG 12</text><text x="1530" y="850" font-family="Arial" font-size="10px" font-weight="800" fill="#087b62" text-anchor="end">Illustrative profiles only</text></svg>